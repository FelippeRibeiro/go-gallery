services:
  app:
    build: .
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    # .env fornece segredos (JWT_SECRET, SMTP_*, MP_*); os valores abaixo
    # sobrescrevem os endereços que dentro do container são diferentes do host
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: postgres://postgres:go-gallery@go-gallery-db:5432/gallery?sslmode=disable
      S3_ENDPOINT: http://minio:9000 # SDK → MinIO via rede interna
      S3_PUBLIC_ENDPOINT: http://localhost:9000 # URLs montadas para o navegador
      # APP_URL: http://localhost:8080 # em prod o Go serve a SPA
      # API_URL: http://localhost:8080
    depends_on:
      go-gallery-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-8080}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gallery-network

  go-gallery-db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: go-gallery
      POSTGRES_DB: gallery
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gallery"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gallery-network
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000" # Porta da API do S3
      - "9001:9001" # Porta do Console Web
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: xGGXvbprQad++HqXR3pGYhPddsF+pOr0wQep06TghnU=
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mc ready local || curl -sf http://localhost:9000/minio/health/live",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gallery-network
volumes:
  postgres_data:
  minio_data: # Novo volume para não perder as fotos ao desligar o Docker

networks:
  gallery-network:
    driver: bridge
