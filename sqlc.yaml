version: '2'
sql:
  - schema: 'db/schema'
    engine: 'postgresql'
    queries: 'db/queries'
    gen:
      go:
        package: 'db'
        out: 'internal/db'
        overrides:
          - db_type: "pg_catalog.numeric"
            go_type: "string"
          - db_type: "numeric"
            go_type: "string"
          - db_type: "pg_catalog.int4"
            go_type: "int64"
          - db_type: "usuario_tipo"
            go_type: "string"
